name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
      - name: Install lint dependencies
        run: npm install -D eslint prettier
      - name: Run lint
        run: npx eslint . --max-warnings=0
      - name: Audit dependencies
        run: npm audit --audit-level=high
        run: npm ci
      - name: Run test scripts with coverage
        run: |
          npx c8 node scripts/*.test.mjs
