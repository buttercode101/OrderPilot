name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run test scripts
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency audit (informational; better-auth 1.7.18 upgrade tracked separately)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
